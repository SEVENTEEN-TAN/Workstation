services:
  app:
    image: ${WORKSTATION_IMAGE:?Run deploy/update.sh first}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/workstation.db
      UPLOAD_DIR: /data/uploads
      ARTICLE_ATTACHMENT_DIR: /data/article-attachments
      BACKUP_DIR: /data/backups
    volumes:
      - ${WORKSTATION_DATA_DIR:-/usr/local/dev/workstation-data}:/data
    ports:
      - "${WORKSTATION_BIND:-127.0.0.1}:${WORKSTATION_PORT:-3001}:3000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
